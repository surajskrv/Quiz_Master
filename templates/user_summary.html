{% extends "base.html" %} 

{% block head %}
  <style>
    nav {
      background-color: #e3f2fd;
    }
  </style>
{% endblock %}

{% block nav %}

<nav class="navbar navbar-expand-lg navbar-light">
  <button class="navbar-toggler ms-2" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item active">
        <a class="nav-link" href="/user">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/user_scores">Scores</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/user_summary">Summary</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/logout">Logout</a>
      </li>
    </ul>
  </div>
  <form class="d-flex ms-2">
    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
    <button class="btn btn-outline-success me-3" type="submit">Search</button>
  </form>
</nav>
  
{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="row">
      <div class="col-lg-6 m-3">
        <h5 class="text-center">Subject wise Quiz Summary</h5>
        <canvas id="bar"></canvas>
      </div>
      <div class="col-lg-4 m-3">
        <h5 class="text-center">Month wise Quiz Summary</h5>
        <canvas id="pie"></canvas>
      </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  const ctx = document.getElementById("bar");
  const cte = document.getElementById("pie");
  new Chart(ctx, {
    type: "bar",
    data: {
      labels: ["Maths", "Physics", "Chemistry"],
      datasets: [
        {
          label: "subjects",
          data: [12, 19, 3],
          borderWidth: 1,
        },
      ],
    },
    options: {
      scales: {
        y: {
          beginAtZero: true,
        },
      },
    },
  });

  new Chart(cte, {
    type: "pie",
    data: {
      labels: [
        'Red',
        'Blue',
        'Yellow'
      ],
      datasets: [{
        label: 'My First Dataset',
        data: [300, 50, 100],
        backgroundColor: [
          'rgb(255, 99, 132)',
          'rgb(54, 162, 235)',
          'rgb(255, 205, 86)'
        ],
        hoverOffset: 4
      }]
    },
  });
</script>

{% endblock %}
