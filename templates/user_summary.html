{% extends "base.html" %} 

{% block head %}
  <style>
    nav {
      background-color: #e3f2fd;
    }
    .chart-container {
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      margin: 50px auto;
      max-width: 800px;
  }
  .chart {
      border: 1px solid #ddd;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
  }
  .chart h3 {
      margin-bottom: 20px;
  }
  </style>
{% endblock %}

{% block nav %}

<nav class="navbar navbar-expand-lg navbar-light">
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item active">
        <a class="nav-link" href="/user">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/user_scores">Scores</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/user_summary">Summary</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/logout">Logout</a>
      </li>
    </ul>
  </div>
  <form class="d-flex">
    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
    <button class="btn btn-outline-success me-3" type="submit">Search</button>
  </form>
</nav>
  
{% endblock %}

{% block content %}
    <div class="container">
        <div class="chart-container">
            <h2 class="text-center mb-4">Summary Charts</h2>
            <div class="row">
                <div class="col-md-6">
                    <div class="chart">
                        <h3>Subject wise no. of quizzes</h3>
                        <div style="height: 200px; border-bottom: 2px solid #000;">
                            <div style="display: inline-block; width: 50px; height: 100px; background-color: lightblue; margin: 0 10px; vertical-align: bottom;"></div>
                            <div style="display: inline-block; width: 50px; height: 180px; background-color: lightgreen; margin: 0 10px; vertical-align: bottom;"></div>
                            <div style="display: inline-block; width: 50px; height: 120px; background-color: lightpink; margin: 0 10px; vertical-align: bottom;"></div>
                        </div>
                        <div style="margin-top: 10px;">Maths Physics Chemistry</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="chart">
                        <h3>Month wise no.of quizzes attempted</h3>
                        <div style="position: relative; width: 200px; height: 200px; margin: 0 auto; border-radius: 50%; background: linear-gradient(to right, lightpink 25%, transparent 25%), linear-gradient(to bottom, lightblue 50%, transparent 50%), linear-gradient(to left, lightgreen 75%, transparent 75%);">
                            <div style="position: absolute; top: 10%; left: 45%;">03</div>
                            <div style="position: absolute; top: 45%; left: 10%;">02</div>
                            <div style="position: absolute; top: 80%; left: 45%;">01</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
