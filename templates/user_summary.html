{% extends "base.html" %} 

{% block head %}
  <style>
    nav {
      background-color: #e3f2fd;
    }
    .chart-container {
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      margin: 50px auto;
      max-width: 800px;
  }
  .chart {
      border: 1px solid #ddd;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
  }
  .chart h3 {
      margin-bottom: 20px;
  }
  </style>
{% endblock %}

{% block nav %}

<nav class="navbar navbar-expand-lg navbar-light">
  <button class="navbar-toggler ms-2" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item active">
        <a class="nav-link" href="/user">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/user_scores">Scores</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/user_summary">Summary</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/logout">Logout</a>
      </li>
    </ul>
  </div>
  <form class="d-flex ms-2">
    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
    <button class="btn btn-outline-success me-3" type="submit">Search</button>
  </form>
</nav>
  
{% endblock %}

{% block content %}

<h3>This is user summary page.</h3>

{% endblock %}
